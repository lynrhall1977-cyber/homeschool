<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homeschool Gradebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: sticky header + tab rail; white workbook surfaces, navy labels, slim subject-color rule only on single-subject views (Grade 3 Workbook Design Guide) */
:root{
  --paper:#F4F7F9; --surface:#FFFFFF; --surface-2:#F8FAFB; --ink:#27313B; --muted:#526D82;
  --rule:#CDD5DA; --rule-strong:#A9B6BF;
  --navy:#183153; --navy-hover:#2E6593; --on-navy:#FFFFFF; --pale-blue:#EAF2F7; --explorer:#2E6593;
  --rust:#C66C38; --rust-soft:#F6E4D8;
  --sand-edge:#D8C4A2; --sand:#F3EBDD;
  --good:#34745D; --warn:#9A5424; --bad:#A4471B;
  --q1:#EAF2F7; --q2:#D5E3EE; --q3:#BFD3E3; --q4:#A9C3D8;
  --s-math:#2E6593; --s-la:#367F85; --s-spell:#183153; --s-sci:#34745D; --s-ss:#C66C38; --s-lib:#526D82; --s-health:#697C52; --s-arts:#27313B;
  --shadow:0 1px 2px rgba(24,49,83,.06),0 6px 20px rgba(24,49,83,.07);
  --f-display:"Montserrat","Arial Black",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Arial,system-ui,sans-serif;
  --f-num:"Montserrat",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1722; --surface:#16202C; --surface-2:#1B2633; --ink:#E3E9EE; --muted:#9FB1C1;
    --rule:#2A3746; --rule-strong:#3D4E61;
    --navy:#8FB6DE; --navy-hover:#AFCBE8; --on-navy:#0F1722; --pale-blue:#1C2D40; --explorer:#7FAEDC;
    --rust:#E39566; --rust-soft:#3A2619;
    --sand-edge:#7A6444; --sand:#33291C;
    --good:#7FC3A6; --warn:#E3A56E; --bad:#F08A5D;
    --q1:#1C2D40; --q2:#22374D; --q3:#29425B; --q4:#304D69;
    --s-math:#7FAEDC; --s-la:#6FC1C6; --s-spell:#A9BCD6; --s-sci:#7FC3A6; --s-ss:#E39566; --s-lib:#A3B7C8; --s-health:#AFC28F; --s-arts:#C9D2DA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1722; --surface:#16202C; --surface-2:#1B2633; --ink:#E3E9EE; --muted:#9FB1C1;
  --rule:#2A3746; --rule-strong:#3D4E61;
  --navy:#8FB6DE; --navy-hover:#AFCBE8; --on-navy:#0F1722; --pale-blue:#1C2D40; --explorer:#7FAEDC;
  --rust:#E39566; --rust-soft:#3A2619;
  --sand-edge:#7A6444; --sand:#33291C;
  --good:#7FC3A6; --warn:#E3A56E; --bad:#F08A5D;
  --q1:#1C2D40; --q2:#22374D; --q3:#29425B; --q4:#304D69;
  --s-math:#7FAEDC; --s-la:#6FC1C6; --s-spell:#A9BCD6; --s-sci:#7FC3A6; --s-ss:#E39566; --s-lib:#A3B7C8; --s-health:#AFC28F; --s-arts:#C9D2DA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;color:var(--navy);line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.55rem}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--navy);font-weight:700;font-family:var(--f-display)}
a{color:var(--explorer)}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.35rem}
.brand .who{color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.qchip{display:inline-flex;align-items:center;gap:6px;background:var(--pale-blue);color:var(--navy);border:1px solid var(--navy);border-radius:999px;padding:3px 11px;font-size:.84rem;font-weight:700;white-space:nowrap}
.saved{font-size:.8rem;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:700;padding:9px 14px 10px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.tab{font-family:var(--f-display);font-weight:600;font-size:.9rem}
.tab-select{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 6px;border-bottom:3px solid transparent;white-space:nowrap}
.tab-select label{font-family:var(--f-display);font-weight:600;font-size:.9rem;color:var(--muted)}
.tab-select select{font-family:var(--f-display);font-weight:600;font-size:.9rem;color:var(--navy);background:var(--surface);border:1px solid var(--rule-strong);padding:5px 28px 5px 9px}
.tab-select.active{border-bottom-color:var(--navy)}
.tab-select.active label{color:var(--navy)}
#settings-btn{gap:6px}
#settings-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.seg{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:20px;scrollbar-width:thin}
.seg button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;font-family:var(--f-display);font-weight:600;font-size:.9rem;color:var(--muted);padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--navy);border-bottom-color:var(--subj,var(--navy))}
.seg button:focus-visible{outline:2px solid var(--explorer);outline-offset:-2px}
.ledger.compact th,.ledger.compact td{padding:6px 7px}
.ledger.compact th{letter-spacing:.04em;font-size:.68rem}
.att-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:18px;align-items:start}
@media (max-width:960px){.att-layout{grid-template-columns:minmax(0,1fr)}}
.att-months .mgrid{font-size:.8rem}
.mgrid button.ad{appearance:none;border:0;font:inherit;font-family:var(--f-num);cursor:pointer;padding:6px 0;border-radius:5px;color:var(--ink)}
.mgrid .ad.p{background:var(--pale-blue)}
.mgrid .ad.fut{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--rule)}
.mgrid .ad.hf{background:var(--sand);box-shadow:inset 0 0 0 1px var(--sand-edge);font-weight:700}
.mgrid .ad.a{background:var(--rust-soft);color:var(--bad);box-shadow:inset 0 0 0 1px var(--rust);font-weight:700}
.mgrid .ad:hover{box-shadow:inset 0 0 0 2px var(--explorer)}
.mgrid .ad.sel{box-shadow:inset 0 0 0 2px var(--navy);font-weight:700}
.mgrid .ad:focus-visible{outline:2px solid var(--explorer);outline-offset:1px}
.att-pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.signin{max-width:440px;margin:48px auto;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:28px}
.signin h2{margin:4px 0 10px}
body.locked .tabs,body.locked #settings-btn,body.locked #hdr-q{display:none}
.saved.sync-saving,.saved.sync-loading{color:var(--explorer)}
.saved.sync-offline,.saved.sync-error{color:var(--warn);font-weight:700}
.book-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-top:14px;margin-bottom:18px}
.book-head .grow{flex:1 1 260px;min-width:0}
.book-nav{display:flex;align-items:center;gap:6px}
.book-nav select{font-family:var(--f-display);font-weight:600;color:var(--navy)}

main{padding-block:24px 64px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.view-head .grow{flex:1 1 300px;min-width:0}
.view-head p{margin-top:4px;max-width:68ch}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;min-width:0}
.panel > h3{margin-bottom:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}

/* Controls */
.btn{appearance:none;font:inherit;font-family:var(--f-display);font-weight:600;font-size:.92rem;border-radius:7px;padding:8px 14px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{background:var(--navy-hover);border-color:var(--navy-hover);color:var(--on-navy)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.pill:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--explorer);outline-offset:2px}
.icon-btn{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:4px 7px;border-radius:5px;line-height:1}
.icon-btn:hover{color:var(--bad);background:var(--rust-soft)}
.icon-btn.armed{color:var(--surface);background:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:700;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--rule-strong);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{resize:vertical;min-height:64px;width:100%}
input[type="checkbox"]{width:17px;height:17px;accent-color:var(--navy);padding:0}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.row > .f{flex:1 1 150px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{appearance:none;font:inherit;font-size:.86rem;font-weight:700;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.pill .g{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--surface);border:2px solid var(--subj,var(--navy));color:var(--ink);padding:4px 11px}
.pill[aria-pressed="true"]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--subj,var(--navy))}
.pill[aria-pressed="true"] .g{color:var(--navy)}
.subj-rule{border-top:4px solid var(--subj,var(--navy))}

/* Ledger tables */
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table.ledger{border-collapse:collapse;width:100%;font-size:.92rem}
.ledger th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);text-align:left;font-weight:700;padding:9px 10px;border-bottom:2px solid var(--rule-strong);background:var(--surface-2);white-space:nowrap}
.ledger td{padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.ledger tr:last-child td{border-bottom:0}
.ledger .margin{border-right:2px solid var(--rule-strong)}
.ledger th.margin{border-right:2px solid var(--rule-strong)}
.ledger td.c,.ledger th.c{text-align:center}
.ledger td.r,.ledger th.r{text-align:right}
.ledger tbody tr:hover td{background:var(--surface-2)}
.ledger input,.ledger select{padding:5px 7px;font-size:.9rem;background:transparent;border-color:transparent}
.ledger input:hover,.ledger select:hover{border-color:var(--rule-strong)}
.ledger input:focus,.ledger select:focus{background:var(--surface-2);border-color:var(--navy)}
.ledger input.t{width:100%;min-width:200px}
.ledger input.score{width:70px;text-align:right;font-family:var(--f-num)}
.ledger input.poss{width:58px;text-align:right;font-family:var(--f-num);color:var(--muted)}
.ledger input.d{width:140px}
.ledger input.n{width:100%;min-width:140px}
.ledger tr.due td:first-child{box-shadow:inset 3px 0 0 var(--rust)}
.ledger tr.excused td{color:var(--muted)}
.ledger tr.excused input.t{text-decoration:line-through}
.subjlink{appearance:none;background:none;border:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;padding:0;text-align:left}
.subjlink:hover{color:var(--navy);text-decoration:underline}
.mark{display:inline-flex;align-items:baseline;gap:6px}
.mark .L{font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:var(--navy);min-width:1.4em;display:inline-block}
.mark .P{font-family:var(--f-num);font-size:.82rem;color:var(--muted)}
.dash{color:var(--rule-strong)}
td.curq,th.curq{background:var(--sand)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--pale-blue);color:var(--navy);white-space:nowrap}
.tag.warn{background:var(--sand);color:var(--warn)}
.tag.bad{background:var(--rust-soft);color:var(--bad)}
.sub{font-size:.78rem;color:var(--muted)}

/* Quarter strip */
.qstrip{display:flex;gap:3px;border-radius:8px;overflow:hidden;position:relative;margin-top:6px}
.qseg{padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.qseg b{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.qseg span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qseg.q1{background:var(--q1)}.qseg.q2{background:var(--q2)}.qseg.q3{background:var(--q3)}.qseg.q4{background:var(--q4)}
.qseg.now{outline:2px solid var(--navy);outline-offset:-2px}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--rust)}
.today-line::after{content:"Today";position:absolute;top:2px;left:5px;font-size:.66rem;font-weight:700;color:var(--rust);text-transform:uppercase;letter-spacing:.06em}

.stats{display:flex;flex-wrap:wrap;gap:10px 28px}
.stat .v{font-family:var(--f-display);font-weight:700;color:var(--navy);font-size:1.6rem;line-height:1.1}
.stat .k{font-size:.8rem;color:var(--muted)}
.callout{border-left:4px solid var(--sand-edge);background:var(--sand);padding:12px 14px;border-radius:0 8px 8px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.callout.info{border-left-color:var(--navy);background:var(--pale-blue)}
.callout.err{border-left-color:var(--bad);background:var(--rust-soft)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty .row{justify-content:center;margin-top:14px}

/* Calendar months */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.month h4{margin:0 0 6px;font-family:var(--f-display);font-weight:600;color:var(--navy);font-size:1rem}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.74rem;text-align:center}
.mgrid .h{color:var(--muted);font-weight:700;padding:2px 0}
.mgrid .c{padding:4px 0;border-radius:4px;font-family:var(--f-num)}
.mgrid .we{color:var(--muted);opacity:.55}
.mgrid .out{opacity:.25}
.mgrid .off{background:repeating-linear-gradient(135deg,var(--rust-soft),var(--rust-soft) 3px,transparent 3px,transparent 6px);color:var(--bad);font-weight:600}
.mgrid .s1{background:var(--q1)}.mgrid .s2{background:var(--q2)}.mgrid .s3{background:var(--q3)}.mgrid .s4{background:var(--q4)}
.mgrid .td{outline:2px solid var(--rust);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.hol-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:4px 18px}
.hol{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--rule);cursor:pointer}
.hol input{margin-top:2px;flex:none}
.hol .when{font-size:.78rem;color:var(--muted)}
.list-rows{display:flex;flex-direction:column;gap:8px}
.list-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.list-row .f{flex:1 1 140px}

/* Import */
.drop{border:2px dashed var(--rule-strong);border-radius:10px;padding:26px;text-align:center;background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--navy);background:var(--pale-blue)}
.drop strong{font-family:var(--f-display);font-weight:600;color:var(--navy);font-size:1.15rem;display:block;margin-bottom:4px}
.counts{display:flex;flex-wrap:wrap;gap:6px}

/* Weights */
.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.wbox{border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--surface-2)}
.wbox input{width:80px;font-family:var(--f-num);font-size:1.1rem}
.wbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;background:var(--rule)}
.wbar i{display:block;height:100%}
.w-daily{background:#183153}.w-test{background:#2E6593}.w-journal{background:#526D82}.w-project{background:#A9C3D8}

/* Report card builder */
.rc-layout{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.rc-layout{grid-template-columns:minmax(0,1fr)}}
.paper-wrap{overflow-x:auto;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:18px}
.paper{background:#fff;color:#27313B;box-shadow:var(--shadow);width:7.5in;margin:0 auto}
.saved-list{display:flex;flex-direction:column}
.saved-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.saved-item:last-child{border-bottom:0}
.saved-item .grow{flex:1 1 200px;min-width:0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#print-area{display:none}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}.brand .who{display:none}h2{font-size:1.35rem}}

@media print{
  body{background:#fff}
  body.printing > *:not(#print-area){display:none !important}
  body.printing #print-area{display:block}
  body.printing::before{display:none}
  @page{size:letter;margin:0.5in}
  body.printing #print-area .rc{width:7.5in}
  html,body{background:#fff !important}
}
</style>
<style id="rc-style">
/* Report card: printed document, fixed white paper look per the workbook guide (navy labels, charcoal ink, #CDD5DA rules) */
.rc{font-family:"Atkinson Hyperlegible",Arial,sans-serif;color:#27313B;width:7.5in;min-height:9.9in;padding:.38in .42in .32in;border:2px solid #183153;font-size:10pt;line-height:1.4;background:#fff;display:flex;flex-direction:column}
.rc *{box-sizing:border-box}
.rc-head{text-align:center;border-bottom:3px solid #183153;padding-bottom:9px;margin-bottom:12px}
.rc-school{font-family:"Montserrat",Arial,sans-serif;font-weight:700;font-size:18pt;color:#183153;line-height:1.2}
.rc-title{font-family:"Montserrat",Arial,sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#555;margin-top:2px}
.rc-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 24px;margin-bottom:12px}
.rc-meta div{display:flex;gap:8px;border-bottom:1px dotted #bbb;padding:3px 0}
.rc-meta b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#666;min-width:84px;padding-top:2px}
.rc table{border-collapse:collapse;width:100%}
.rc-grades th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#444;background:#EAF2F7;border:1px solid #CDD5DA;padding:6px 8px;text-align:center}
.rc-grades th:first-child{text-align:left}
.rc-grades td{border:1px solid #CDD5DA;padding:4px 8px;text-align:center}
.rc-grades td:first-child{text-align:left;font-weight:700;border-right:2px solid #183153}
.rc-grades .cur{background:#F3EBDD}
.rc-grades .L{font-family:"Montserrat",Arial,sans-serif;font-weight:700;font-size:12.5pt;color:#183153}
.rc-grades .P{display:block;font-size:7.5pt;line-height:1.1;color:#666;font-family:"Montserrat",Arial,sans-serif}
.rc-grades .na{color:#bbb}
.rc-sec{margin-top:12px;break-inside:avoid}
.rc-sec h4{margin:0 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#183153}
.rc-att td,.rc-att th{border:1px solid #CDD5DA;padding:3px 8px;text-align:center;font-size:9.5pt}
.rc-att th{background:#EAF2F7;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#444}
.rc-att td:first-child,.rc-att th:first-child{text-align:left}
.rc-comment{padding:4px 0;border-bottom:1px dotted #ccc;break-inside:avoid}
.rc-comment b{color:#183153}
.rc-scale{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:#444}
.rc-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:auto;padding-top:34px;break-inside:avoid}
.rc-sign div{border-top:1px solid #333;padding-top:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#555}
.rc-foot{margin-top:10px;font-size:7.5pt;color:#888;text-align:right}
.rc table tr{break-inside:avoid}
.att-rec .rc-att{margin-bottom:4px}
.att-rec .rc-sign{padding-top:26px}
.att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 16px}
.att-notes{columns:2;column-gap:20px}
.att-notes .rc-comment{font-size:9pt}
.att-m{break-inside:avoid}
.att-mh{font-family:"Montserrat",Arial,sans-serif;font-weight:700;font-size:11px;color:#183153;margin-bottom:3px}
.att-mh em{font-style:normal;font-weight:500;color:#666;font-size:10px}
.att-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:9px;text-align:center}
.att-cal span{border:1px solid #CDD5DA;min-height:14px;padding:0;line-height:1.05;color:#183153;font-weight:700}
.att-cal span:empty{border:0}
.att-cal span i{display:block;font-style:normal;font-weight:400;color:#888;font-size:8px}
.att-cal span.nd{background:#f4f6f8;color:#999;font-weight:400}
.att-cal span.x{background:#F3EBDD;color:#A4471B}

var state, storageOK=true;
function loadState(){
  if(cloud.on){ var cached=null; try{ var cr=localStorage.getItem(CLOUD_CACHE); if(cr) cached=JSON.parse(cr); }catch(e){ storageOK=false; } state=normalize(cached||defaultState()); return; }
  var embedded=null, local=null;
  try{ var t=$('#embedded-data').textContent; embedded=JSON.parse(t); }catch(e){}
  try{ var raw=localStorage.getItem(STORE_KEY); if(raw) local=JSON.parse(raw); }catch(e){ storageOK=false; }
  var pick=null;
  if(embedded&&local) pick=(embedded.updatedAt||0)>(local.updatedAt||0)?embedded:local; else pick=local||embedded;
  state=normalize(pick||defaultState());
}
function normalize(s){
  var d=defaultState();
  s=s||{}; s.settings=Object.assign({},d.settings,s.settings||{});
  s.settings.holidays=s.settings.holidays||{}; s.settings.weights=Object.assign({},d.settings.weights,s.settings.weights||{});
  if(!Array.isArray(s.settings.scale)||!s.settings.scale.length) s.settings.scale=d.settings.scale;
  if(!Array.isArray(s.settings.customQuarterEnds)) s.settings.customQuarterEnds=['','',''];
  if(!(+s.settings.schoolDays>0)){ var n=184; if(s.settings.endDate){ var tmp=computeCalendar(Object.assign({},s.settings,{schoolDays:400})); n=tmp.days.filter(function(x){return x<=s.settings.endDate;}).length||184; } s.settings.schoolDays=n; }
  delete s.settings.endDate;
  if(!s.settings.meetDays) s.settings.meetDays={'Science':[1,3,5],'Social Studies':[1,3,5]};
  if(!s.settings.meetDays['Health & Physical Education']) s.settings.meetDays['Health & Physical Education']=[2];
  if(!s.settings.meetDays['Library Skills']) s.settings.meetDays['Library Skills']=[4];
  if(!s.settings.testLast) s.settings.testLast={'Spelling':true};
  s.assignments=Array.isArray(s.assignments)?s.assignments:[];
  s.reportCards=Array.isArray(s.reportCards)?s.reportCards:[];
  s.rcDrafts=s.rcDrafts||{};
  s.attendance=s.attendance&&typeof s.attendance==='object'?s.attendance:{};
  if(!(+s.settings.attendanceGoal>0)) s.settings.attendanceGoal=175;
  return s;
}
var saveTimer=null;
function save(){
  state.updatedAt=Date.now();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{ localStorage.setItem(cloud.on?CLOUD_CACHE:STORE_KEY,JSON.stringify(state)); storageOK=true; }catch(e){ storageOK=false; }
    renderHeader();
  },250);
  cal=null;
  cloudQueue();
}

/* ---------- Cloud (Supabase) ----------
   One shared row per gradebook: {id, data (jsonb), rev, updated_at, updated_by}.
   Saves send rev+1 and only succeed if nobody else saved in between (rev check).
   A copy is cached in this browser so the page opens fast and survives a dropped connection. */
var SUPA_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js';
var cloud={on:!!(CLOUD_CONFIG.url&&CLOUD_CONFIG.anonKey),client:null,user:null,ready:false,rev:0,status:'off',msg:'',timer:null,busy:false,seq:0,sentTo:'',lastBy:'',lastAt:''};
var CLOUD_CACHE=STORE_KEY+'-cloud', CLOUD_PENDING=STORE_KEY+'-cloud-pending';
function cloudSet(st,msg){ cloud.status=st; cloud.msg=msg||''; if(state) renderHeader(); }
function cloudPending(v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(CLOUD_PENDING)||'null'); if(v) localStorage.setItem(CLOUD_PENDING,JSON.stringify(v)); else localStorage.removeItem(CLOUD_PENDING); }catch(e){ return null; } }
function cloudCache(){ try{ localStorage.setItem(CLOUD_CACHE,JSON.stringify(state)); }catch(e){} }
function cloudBoot(){
  cloudSet('loading');
  loadScript(SUPA_LIB).then(function(){
    cloud.client=window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
    cloud.client.auth.onAuthStateChange(function(ev,session){
      setTimeout(function(){
        if(ev==='SIGNED_OUT'){ cloud.user=null; cloud.ready=false; cloud.status='signin'; render(); return; }
        if(session&&session.user&&(!cloud.user||cloud.user.id!==session.user.id)){ cloud.user=session.user; cloudPull(true); }
      },0);
    });
    return cloud.client.auth.getSession();
  }).then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(sess){ if(!cloud.user){ cloud.user=sess.user; cloudPull(true); } }
    else if(!cloud.user){ cloud.status='signin'; render(); }
  }).catch(function(){ cloudSet('error','The sign-in service couldn’t be reached. Check the internet connection, then reload the page.'); render(); });
}
function cloudPull(initial){
  if(!cloud.client) return Promise.resolve();
  if(initial) cloudSet('loading');
  return cloud.client.from('gradebooks').select('data,rev,updated_at,updated_by').eq('id',CLOUD_CONFIG.gradebookId).maybeSingle().then(function(res){
    if(res.error) throw res.error;
    if(!res.data){ cloud.ready=false; cloudSet('denied'); render(); return; }
    var row=res.data, pend=cloudPending();
    cloud.ready=true; cloud.lastBy=row.updated_by||''; cloud.lastAt=row.updated_at||'';
    if(!row.data||!row.data.settings){ cloud.rev=row.rev; cloudSet('saving'); cloudPush(); }          // first sign-in: upload what this page has
    else if(pend&&pend.baseRev===row.rev){ cloud.rev=row.rev; cloudSet('saving'); cloudPush(); }     // this device has unsent changes and nothing newer exists
    else {
      if(pend) toast('Changes made here while offline were replaced by newer changes from another device.');
      cloudPending(null); state=normalize(row.data); cloud.rev=row.rev; cloudCache(); cal=null; cloudSet('saved');
    }
    render();
  }).catch(function(e){ cloudSet(navigator.onLine===false?'offline':'error',(e&&e.message)||''); render(); });
}
function cloudQueue(){
  if(!cloud.ready) return;
  cloud.seq++; cloudPending({baseRev:cloud.rev,at:Date.now()}); cloudSet('saving');
  clearTimeout(cloud.timer); cloud.timer=setTimeout(cloudPush,1200);
}
function cloudPush(){
  if(!cloud.ready||!cloud.client) return;
  if(cloud.busy){ clearTimeout(cloud.timer); cloud.timer=setTimeout(cloudPush,700); return; }
  if(navigator.onLine===false){ cloudSet('offline'); return; }
  cloud.busy=true; var base=cloud.rev, seq=cloud.seq, payload=JSON.parse(JSON.stringify(state)), who=(cloud.user&&cloud.user.email)||'';
  cloud.client.from('gradebooks').update({data:payload,rev:base+1,updated_at:new Date().toISOString(),updated_by:who}).eq('id',CLOUD_CONFIG.gradebookId).eq('rev',base).select('rev').then(function(res){
    cloud.busy=false;
    if(res.error) throw res.error;
    if(!res.data||!res.data.length){ cloudPending(null); toast('This gradebook was just changed on another device. Showing the newest version; re-enter your last change if it’s missing.'); return cloudPull(); }
    cloud.rev=res.data[0].rev; cloud.lastBy=who; cloud.lastAt=new Date().toISOString();
    if(seq===cloud.seq){ cloudPending(null); cloudSet('saved'); }
    else { cloudPending({baseRev:cloud.rev,at:Date.now()}); clearTimeout(cloud.timer); cloud.timer=setTimeout(cloudPush,400); }
  }).catch(function(e){ cloud.busy=false; cloudSet(navigator.onLine===false?'offline':'error',(e&&e.message)||''); });
}
function cloudCheck(){ // pick up changes made on another device
  if(!cloud.ready||cloud.busy||cloudPending()) return;
  cloud.client.from('gradebooks').select('rev').eq('id',CLOUD_CONFIG.gradebookId).maybeSingle().then(function(res){
    if(res.data&&res.data.rev>cloud.rev){ var ae=document.activeElement; if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return; cloudPull().then(function(){ toast('Updated with changes from another device'); }); }
  });
}
function cloudSignOut(){
  if(!cloud.client) return;
  try{ localStorage.removeItem(CLOUD_CACHE); localStorage.removeItem(CLOUD_PENDING); }catch(e){}
  cloud.client.auth.signOut().finally(function(){ state=defaultState(); cloud.user=null; cloud.ready=false; cloud.status='signin'; cloud.sentTo=''; render(); });
}
window.addEventListener('online',function(){ if(cloud.ready&&cloudPending()) cloudPush(); else cloudCheck(); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') cloudCheck(); });
setInterval(function(){ if(document.visibilityState==='visible'){ if(cloud.ready&&cloudPending()&&!cloud.busy) cloudPush(); else cloudCheck(); } },60000);

function viewSignIn(){
  var h='<div class="signin"><p class="eyebrow">Homeschool Gradebook</p><h2>Sign in</h2>';
  if(cloud.status==='loading') return h+'<p class="muted">Connecting…</p></div>';
  if(cloud.status==='error') return h+'<div class="callout err"><span>'+esc(cloud.msg||'Something went wrong connecting to the gradebook.')+'</span><button class="btn small" data-action="si-retry">Try again</button></div></div>';
  if(cloud.status==='denied') return h+'<p>You’re signed in as <b>'+esc(cloud.user&&cloud.user.email)+'</b>, but that email isn’t on this gradebook’s member list.</p><p class="muted" style="margin-top:8px">Add it to the <code>gradebook_members</code> table in Supabase (README, step 2), then sign in again.</p><div class="row" style="margin-top:14px"><button class="btn" data-action="cloud-signout">Sign out</button></div></div>';
  h+='<p class="muted">Your grades are saved in your private online gradebook. Enter your email and we’ll send you a sign-in link.</p>';
  h+='<form id="si-form" class="stack" style="gap:12px;margin-top:16px" autocomplete="on"><label class="f">Email<input id="si-email" type="email" required autocomplete="email" value="'+esc(cloud.sentTo)+'"></label><button class="btn primary" type="submit">'+(cloud.sentTo?'Send another link':'Email me a sign-in link')+'</button></form>';
  if(cloud.sentTo){
    h+='<div class="callout info" style="margin-top:16px"><span>Check <b>'+esc(cloud.sentTo)+'</b> and open the link on this device. If the email shows a 6-digit code, you can type it here instead.</span></div>';
    h+='<form id="si-code-form" class="row" style="margin-top:12px"><label class="f">Code<input id="si-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></label><button class="btn" type="submit">Sign in with code</button></form>';
  }
  if(cloud.msg&&cloud.status==='signin') h+='<div class="callout err" style="margin-top:14px"><span>'+esc(cloud.msg)+'</span></div>';
  return h+'</div>';
}

/* ---------- calendar + grades ---------- */
var cal=null;
function getCal(){ if(!cal) cal=computeCalendar(state.settings); return cal; }
function itemDate(a){
  if(a.date) return a.date; var c=getCal();
  if(a.week){ var wk=c.weeks&&c.weeks[a.week-1]; if(!wk) return ''; return testLast(a.subject)?placeTestLast(wk,Math.max(a.wday||1,1)):placeWeekDay(wk,meetDays(a.subject),Math.max(a.wday||1,1)); }
  if(a.day&&c.days[a.day-1]) return c.days[a.day-1]; return '';
}
function testLast(subject){ var t=state.settings.testLast; return !!(t&&t[subject]); }
function meetDays(subject){ var m=state.settings.meetDays&&state.settings.meetDays[subject]; return m&&m.length?m:[1,2,3,4,5]; }
function scheduleLabel(a){ return a.week?'Week '+a.week+' · Day '+(a.wday||1):(a.day?'School day '+a.day:''); }
function quarterOf(dateS){
  if(!dateS) return 0; var c=getCal(); if(!c.quarters.length) return 0;
  var last=c.quarters[3].end; if(dateS<c.quarters[0].start||dateS>last) return 0;
  var q=0; c.quarters.forEach(function(x){ if(x.start<=dateS) q=x.n; }); return q;
}
function quarterStatus(){
  var c=getCal(), t=todayISO(); if(!c.quarters.length) return {phase:'none'};
  if(t<c.quarters[0].start) return {phase:'before',next:c.quarters[0]};
  if(t>c.quarters[3].end) return {phase:'after',prev:c.quarters[3]};
  var cur=null; c.quarters.forEach(function(q){ if(q.start<=t) cur=q; });
  var prev=null; c.quarters.forEach(function(q){ if(q.end<t) prev=q; });
  var dayNum=cur.days.filter(function(d){return d<=t;}).length;
  var yearDay=c.days.filter(function(d){return d<=t;}).length;
  return {phase:'during',cur:cur,prev:prev,dayNum:dayNum,yearDay:yearDay};
}
function isGraded(a){ return !a.excused && a.earned!=null && a.earned!=='' && +a.possible>0; }
function calcGrade(subject,qn){
  var by={}; TYPES.forEach(function(t){by[t.id]={e:0,p:0,n:0};});
  var count=0;
  state.assignments.forEach(function(a){
    if(a.subject!==subject||!isGraded(a)) return;
    if(qn && quarterOf(itemDate(a))!==qn) return;
    var b=by[a.type]||by.daily; b.e+=+a.earned; b.p+=+a.possible; b.n++; count++;
  });
  var tot=0, ws=0, w=state.settings.weights;
  TYPES.forEach(function(t){ var b=by[t.id]; if(b.p>0){ var wt=Math.max(0,+w[t.id]||0); tot+=wt*(b.e/b.p); ws+=wt; } });
  if(count&&ws===0){ var e=0,p=0; TYPES.forEach(function(t){e+=by[t.id].e;p+=by[t.id].p;}); return {pct:p?100*e/p:null,count:count,by:by}; }
  return {pct:ws?100*tot/ws:null,count:count,by:by};
}
function yearGrade(subject,uptoQ){
  var vals=[]; for(var q=1;q<=(uptoQ||4);q++){ var g=calcGrade(subject,q); if(g.pct!=null) vals.push(g.pct); }
  return vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
}
function letter(pct,scale){
  if(pct==null) return '';
  var r=Math.round(pct); var rows=(scale||state.settings.scale).slice().sort(function(a,b){return b.min-a.min;});
  for(var i=0;i<rows.length;i++){ if(r>=+rows[i].min) return rows[i].l; }
  return rows.length?rows[rows.length-1].l:'';
}
function markHTML(pct,opts){
  if(pct==null) return '<span class="dash">—</span>';
  return '<span class="mark"><span class="L">'+esc(letter(pct))+'</span><span class="P">'+Math.round(pct)+'%</span></span>';
}
function needsGrade(a){ var d=itemDate(a); return !a.excused && (a.earned==null||a.earned==='') && d && d<=todayISO(); }

/* ---------- header + tabs ---------- */
var view='overview';
function renderHeader(){
  var s=state.settings;
  $('#hdr-who').textContent=[s.studentName,s.gradeLevel,s.schoolYear].filter(Boolean).join(' · ');
  var qs=quarterStatus(), chip=$('#hdr-q');
  if(qs.phase==='during') chip.textContent='Quarter '+qs.cur.n+' · Day '+qs.yearDay;
  else if(qs.phase==='before') chip.textContent='Starts '+fmt(qs.next.start);
  else if(qs.phase==='after') chip.textContent='Year complete';
  else chip.textContent='Set up calendar';
  var sv=$('#hdr-saved');
  if(cloud.on){ var map={saved:'Saved to cloud',saving:'Saving…',offline:'Offline · will sync',error:'Not synced · retrying',loading:'Connecting…',signin:'Not signed in',denied:'No access'};
    sv.textContent=map[cloud.status]||''; sv.className='saved hide-sm sync-'+cloud.status; sv.title=cloud.lastAt?'Last saved '+new Date(cloud.lastAt).toLocaleString()+(cloud.lastBy?' by '+cloud.lastBy:''):''; }
  else sv.textContent=storageOK?'Saved in this browser':'Not saving automatically';
  $$('.tab').forEach(function(t){ t.setAttribute('aria-selected',t.dataset.tab===view?'true':'false'); });
  $('#settings-btn').setAttribute('aria-pressed',view==='settings'?'true':'false');
  $('#nav-subject-wrap').classList.toggle('active',view==='grades');
  var sel=$('#nav-subject'); if(document.activeElement!==sel) sel.innerHTML=subjectOptions(view==='grades'?gb.subject:'',true);
}
function subjectOptions(current,placeholder){
  var qn=quarterStatus().phase==='during'?quarterStatus().cur.n:0;
  var h=placeholder&&!current?'<option value="" selected disabled>Choose a subject</option>':'';
  SUBJECTS.forEach(function(s){ var g=calcGrade(s,qn); h+='<option value="'+esc(s)+'"'+(s===current?' selected':'')+'>'+esc(s)+(g.pct!=null?' · '+esc(letter(g.pct)):'')+'</option>'; });
  return h;
}
var settingsTab='import';
function go(v,opts){
  if(v==='import'){ settingsTab='import'; v='settings'; } else if(v==='calendar'){ settingsTab='year'; v='settings'; }
  view=v; render(); if(!(opts&&opts.keepScroll)) window.scrollTo(0,0);
}
function render(){
  var locked=cloud.on&&!cloud.ready; document.body.classList.toggle('locked',locked);
  if(locked){ renderHeader(); $('#view').innerHTML=viewSignIn(); return; }
  renderHeader();
  var fn={overview:viewOverview,grades:viewGrades,attendance:viewAttendance,reports:viewReports,settings:viewSettings}[view];
  $('#view').innerHTML=fn();
  if(view==='reports') refreshPreview();
}

/* ---------- Overview ---------- */
function viewOverview(){
  var c=getCal(), qs=quarterStatus(), s=state.settings, h='';
  h+='<div class="view-head"><div class="grow"><p class="eyebrow">'+esc(fmtLong(todayISO()))+'</p><h2>'+esc(s.studentName||'Student')+'’s '+esc(s.schoolYear||'school year')+'</h2></div>';
  h+='<div class="row"><button class="btn" data-action="goto" data-to="import">Import curriculum</button><button class="btn primary" data-action="goto" data-to="grades">Open gradebook</button></div></div>';
  if(!storageOK) h+='<div class="callout err" style="margin-bottom:18px"><span>This browser isn’t letting the gradebook save automatically. Use <b>Save a copy with my data</b> or <b>Export backup</b> in Settings → Backup so you don’t lose grades.</span><button class="btn small" data-action="stab-go" data-stab="data">Open Backup</button></div>';
  if(c.error){ h+='<div class="callout err"><span>'+esc(c.error)+'</span><button class="btn small" data-action="goto" data-to="calendar">Open school year settings</button></div>'; return h; }
  h+='<div class="stack">';
  // quarter panel
  h+='<section class="panel"><div class="panel-head"><h3>Quarters</h3><span class="sub">'+c.days.length+' school days · '+fmt(c.quarters[0].start,{y:1})+' – '+fmt(c.quarters[3].end,{y:1})+'</span></div>';
  h+='<div class="stats" style="margin-bottom:12px">';
  if(qs.phase==='during'){
    var left=qs.cur.days.length-qs.dayNum;
    h+='<div class="stat"><div class="v">Q'+qs.cur.n+'</div><div class="k">Current quarter</div></div>';
    h+='<div class="stat"><div class="v num">'+qs.dayNum+' / '+qs.cur.days.length+'</div><div class="k">Days done this quarter</div></div>';
    h+='<div class="stat"><div class="v num">'+left+'</div><div class="k">School days left · ends '+fmt(qs.cur.end,{wd:1})+'</div></div>';
    h+='<div class="stat"><div class="v num">'+qs.yearDay+'</div><div class="k">Day of the school year</div></div>';
    var ys=attSummary(c.days); h+='<div class="stat"><div class="v num">'+fmtDays(ys.attended)+'</div><div class="k">Days attended'+(ys.absent+ys.half?' · '+fmtDays(ys.absent+ys.half/2)+' absent':'')+'</div></div>';
  } else if(qs.phase==='before'){
    h+='<div class="stat"><div class="v">'+fmt(qs.next.start,{wd:1})+'</div><div class="k">First day of school</div></div>';
  } else {
    h+='<div class="stat"><div class="v">Done</div><div class="k">The school year ended '+fmt(c.quarters[3].end,{y:1})+'</div></div>';
  }
  h+='</div>'+quarterStrip(c,qs)+'</section>';
  // report card nudge
  if(qs.prev){
    var have=state.reportCards.some(function(r){return r.quarter===qs.prev.n;});
    h+='<div class="callout'+(have?' info':'')+'"><span>'+(have?'Quarter '+qs.prev.n+' report card is saved.':'Quarter '+qs.prev.n+' ended '+fmt(qs.prev.end,{wd:1})+'. Its report card is ready to create.')+'</span><button class="btn small'+(have?'':' primary')+'" data-action="rc-prev">'+(have?'View report cards':'Create Q'+qs.prev.n+' report card')+'</button></div>';
  }
  // grade table
  var due=state.assignments.filter(needsGrade).length, unsched=state.assignments.filter(function(a){return !itemDate(a);}).length;
  var curN=qs.phase==='during'?qs.cur.n:0;
  h+='<section><div class="panel-head"><h3>Grades by subject</h3><span class="sub">Click a subject to open its grades</span></div>';
  if(!state.assignments.length){
    h+='<div class="panel empty"><h3>No assignments yet</h3><p>Import your curriculum to fill in each subject’s lessons, tests and writing, or add assignments by hand.</p><div class="row"><button class="btn primary" data-action="goto" data-to="import">Import curriculum</button><button class="btn" data-action="goto" data-to="grades">Add an assignment</button><button class="btn" data-action="sample">Try with sample grades</button></div></div>';
  } else {
    h+='<div class="table-wrap"><table class="ledger"><thead><tr><th class="margin">Subject</th>';
    for(var q=1;q<=4;q++) h+='<th class="c'+(q===curN?' curq':'')+'">Q'+q+'</th>';
    h+='<th class="c">Year</th><th class="r">To grade</th></tr></thead><tbody>';
    SUBJECTS.forEach(function(sub){
      var nd=state.assignments.filter(function(a){return a.subject===sub&&needsGrade(a);}).length;
      var total=state.assignments.filter(function(a){return a.subject===sub;}).length;
      h+='<tr><td class="margin"><button class="subjlink" data-action="open-subject" data-subject="'+esc(sub)+'">'+esc(sub)+'</button><div class="sub">'+total+' assignment'+(total===1?'':'s')+'</div></td>';
      for(var q=1;q<=4;q++){ h+='<td class="c'+(q===curN?' curq':'')+'">'+markHTML(calcGrade(sub,q).pct)+'</td>'; }
      h+='<td class="c">'+markHTML(yearGrade(sub))+'</td><td class="r">'+(nd?'<span class="tag warn">'+nd+' to grade</span>':'<span class="sub">Up to date</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    if(due||unsched){
      h+='<div class="row" style="margin-top:10px">';
      if(due) h+='<span class="tag warn">'+due+' past assignment'+(due===1?'':'s')+' without a grade</span>';
      if(unsched) h+='<span class="tag bad">'+unsched+' without a date (not counted in any quarter)</span>';
      h+='</div>';
    }
  }
  h+='</section></div>';
  return h;
}
function quarterStrip(c,qs){
  var N=c.days.length, h='<div class="qstrip">';
  c.quarters.forEach(function(q){
    var now=qs.phase==='during'&&qs.cur.n===q.n;
    h+='<div class="qseg q'+q.n+(now?' now':'')+'" style="flex:'+q.days.length+' 1 0"><b>Q'+q.n+'</b><span>'+fmt(q.start)+' – '+fmt(q.end)+'</span><span class="num">'+q.days.length+' days</span></div>';
  });
  if(qs.phase==='during'){ var pct=100*(qs.yearDay-0.5)/N; h+='<div class="today-line" style="left:calc('+pct.toFixed(2)+'% - 1px)"></div>'; }
  return h+'</div>';
}

/* ---------- Gradebook ---------- */
var gb={subject:SUBJECTS[0],quarter:null,status:'all',q:''};
function viewGrades(){
  var qs=quarterStatus(); if(gb.quarter===null) gb.quarter=qs.phase==='during'?String(qs.cur.n):'all';

var LIBS={
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'

function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){rej(new Error('Could not load a file reader. Check your internet connection and try again, or save the file as CSV or text.'));}; document.head.appendChild(s); }); }
function readAs(file,how){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; if(how==='text') r.readAsText(file); else r.readAsArrayBuffer(file); }); }
function handleFile(file){
  if(!file) return;
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  draft={name:file.name,items:[],loading:true}; $('#draft-area').innerHTML='<div class="callout info"><span>Reading '+esc(file.name)+'…</span></div>';
  var p;
  if(ext==='xlsx'||ext==='xls'){
    p=(window.XLSX?Promise.resolve():loadScript(LIBS.xlsx)).then(function(){return readAs(file,'buf');}).then(function(buf){
      var wb=XLSX.read(buf,{type:'array',cellDates:true}); var all=[];
      wb.SheetNames.forEach(function(n){ var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}); all=all.concat(parseTable(rows,matchSubject(n))); });
      return all;
    });
  } else if(ext==='csv'||ext==='tsv'){
    p=readAs(file,'text').then(function(t){ return parseTable(parseCSV(t,ext==='tsv'?'\t':null),''); });
  } else if(ext==='docx'){
    p=(window.mammoth?Promise.resolve():loadScript(LIBS.mammoth)).then(function(){return readAs(file,'buf');}).then(function(buf){ return mammoth.extractRawText({arrayBuffer:buf}); }).then(function(r){ return readText(r.value,file.name); });
  } else if(ext==='pdf'){
    p=(window.pdfjsLib?Promise.resolve():loadScript(LIBS.pdf)).then(function(){ pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker; return readAs(file,'buf'); }).then(function(buf){ return pdfPages(buf); }).then(function(pages){ return readPages(pages,file.name); });
  } else if(ext==='json'){
    p=readAs(file,'text').then(function(t){ var j=JSON.parse(t); if(j&&j.settings&&j.assignments) throw new Error('This looks like a gradebook backup. Use Settings → Backup → Restore from backup instead.'); var arr=Array.isArray(j)?j:(j.assignments||j.items||[]); return arr.map(function(o){ var title=o.title||o.name||o.assignment||o.lesson||''; var ty=o.type?(/daily|lesson|worksheet|homework/i.test(o.type)?'daily':classifyType(o.type)):classifyType(title); return mkDraftItem(matchSubject(o.subject||'')||'',title,ty,toDay(o.day),toISODate(o.date),o.possible||o.points,true); }); });
  } else {

  }

}
function setDraft(name,items){
  var fs=importOpts.subject!=='auto'?importOpts.subject:'';
  items.forEach(function(i){ if(fs) i.subject=fs; i.include=true; });
  items.forEach(function(i){ if(i.week) i.baseWeek=i.week; });
  draft={name:name,items:items,workbook:items.workbook||null,sample:items.sample||'',startWeekOf:'',weekShift:0};
  if(items.noText) draft.error='The pages of '+name+' are pictures, not text, so the corner labels can’t be read. Save or export the PDF again from the program you made the workbook in (not a scan or “print as image”), then import that file.';

/* Labelled workbooks: every page carries a corner label, front and back.
   Cycle style (Math Loops):      "Cycle 1 Lesson 1 Day 1 Front", "Lesson 1 Day 1 Back", "Cycle 1 Test Day 10 Front"
   Unit style (Science, Social):  "Unit 1 Lesson 1 Week 1 Day 1", "Unit 1 Unit Test Week 4 Day 3"
   Front and back of the same lesson or test become one assignment. "Day #" in the cycle style is the
   school day of the year; "Week # Day #" in the unit style is the Nth school day of that school week. */

/* ---------- Attendance ---------- */
/* Every school day counts as present unless marked. Stored only for marked days: {date:{s:'A'|'H', n:'note'}}. */
function attStatus(k){ var a=state.attendance[k]; return a&&a.s?a.s:'P'; }
function absWeight(k){ var st=attStatus(k); return st==='A'?1:st==='H'?0.5:0; }
function absencesIn(days){ return days.reduce(function(a,k){ return a+absWeight(k); },0); }
function fmtDays(n){ return (Math.round(n*10)/10).toString().replace(/\.5$/,'½').replace(/^0½$/,'½'); }
function attSummary(days){
  var t=todayISO(), r={session:days.length,held:0,absent:0,half:0,attended:0};
  days.forEach(function(k){ var st=attStatus(k); if(st==='A') r.absent++; else if(st==='H') r.half++; if(k<=t){ r.held++; r.attended+=1-absWeight(k); } });
  return r;
}

  s.scale.forEach(function(r,i){ h+='<tr><td class="margin"><input data-sc="l" data-i="'+i+'" value="'+esc(r.l)+'" style="width:60px" aria-label="Mark"></td><td><input type="number" min="0" max="100" data-sc="min" data-i="'+i+'" value="'+esc(r.min)+'" style="width:80px" aria-label="Lowest percent"></td><td><input data-sc="d" data-i="'+i+'" value="'+esc(r.d||'')+'" aria-label="Meaning" style="width:100%"></td></tr>'; });
  h+='</tbody></table></div></section>';
  }
  if(tab==='data'){
  if(cloud.on){
    h+='<section class="panel"><h3>Cloud sync</h3><p class="muted" style="margin-bottom:12px">Everything saves to your private online gradebook within a couple of seconds of each change, and opens the same on any device you sign in on.</p>';
    h+='<div class="stack" style="gap:6px;margin-bottom:12px"><div>Signed in as <b>'+esc(cloud.user&&cloud.user.email)+'</b></div><div class="sub">'+(cloud.lastAt?'Last saved '+esc(new Date(cloud.lastAt).toLocaleString())+(cloud.lastBy?' by '+esc(cloud.lastBy):''):'')+'</div></div>';
    h+='<div class="row"><button class="btn" data-action="cloud-sync">Sync now</button><button class="btn" data-action="cloud-signout">Sign out</button></div><p class="sub" style="margin-top:10px">Signing out also removes the copy saved in this browser, so use it on shared computers.</p></section>';
  }
  h+='<section class="panel"><h3>'+(cloud.on?'Backups':'Your data')+'</h3><p class="muted" style="margin-bottom:12px">'+(cloud.on?'Export a backup now and then, such as at the end of each quarter, and keep it with the portfolio.':(storageOK?'Grades save automatically in this browser on this computer.':'This browser isn’t saving automatically.')+' Keep a backup too: clearing browser data or opening this file on another computer starts empty.')+'</p>';
  h+='<div class="stack" style="gap:10px">'+(cloud.on?'':'<div class="row"><button class="btn primary" data-action="save-copy">Save a copy with my data</button>')+''+(cloud.on?'':'<span class="sub" style="flex:1 1 200px">Downloads this gradebook as a new HTML file with every grade inside. Open that file next time; it works on any computer.</span></div>')+'';
  h+='<div class="row"><button class="btn" data-action="export">Export backup</button><button class="btn" data-action="import-backup">Restore from backup</button></div>';
  h+='<div class="row" style="margin-top:6px"><button class="btn danger" data-action="reset">'+(cloud.on?'Erase everything (cloud too)':'Erase everything')+'</button></div></div></section>';
  }
  return h+'</div>';
}

/* ---------- sample data ---------- */
function loadSample(){
  var c=getCal(), t=todayISO(), days=c.days.filter(function(d){return d<=t;}); if(!days.length) days=c.days.slice(0,30);
  var plan={'Math':['daily','test',10],'Language Arts':['daily','journal',5],'Spelling':['daily','test',5],'Science':['daily','project',15],'Social Studies':['daily','test',15],'Health & Physical Education':['daily','project',20],'Library Skills':['daily','journal',10],'Fine Arts':['daily','project',10]};
  var weekly={'Science':3,'Social Studies':3,'Health & Physical Education':5,'Library Skills':5,'Fine Arts':5};
  var seed=7; function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  var ord=state.assignments.length;
  Object.keys(plan).forEach(function(sub){ var p=plan[sub], n=0, every=weekly[sub]||1;
    days.forEach(function(d,i){ if(i%every!==0) return; n++; var isT=(n%p[2]===0), type=isT?p[1]:'daily';
      var title=(sub==='Spelling'?(isT?'Week '+Math.ceil(n/5)+' spelling test':'Week '+Math.ceil(n/5)+' Day '+(((n-1)%5)+1)):(isT?(type==='test'?'Test '+(n/p[2]):type==='journal'?'Journal entry '+(n/p[2]):'Project '+(n/p[2])):'Lesson '+n));
      var poss=type==='daily'?10:100, sc=0.72+rnd()*0.28;
      state.assignments.push({id:uid(),subject:sub,title:title+' (sample)',type:type,date:d,day:null,possible:poss,earned:d<t||i<days.length-2?Math.round(sc*poss):null,excused:false,notes:'',source:'sample',order:ord++}); });
  });
  save(); toast('Sample grades added. Remove them on the Gradebook tab search “sample”, or Erase everything.'); render();
}

/* ---------- events ---------- */
var armed={};
function arm(btn,key,label,fn){
  if(armed[key]){ clearTimeout(armed[key]); delete armed[key]; fn(); return; }
  var old=btn.textContent; btn.classList.add('armed'); btn.textContent=label;
  armed[key]=setTimeout(function(){ delete armed[key]; btn.classList.remove('armed'); btn.textContent=old; },3500);
}
document.addEventListener('click',function(e){
  var tab=e.target.closest('.tab'); if(tab){ go(tab.dataset.tab); return; }
  var drop=e.target.closest('#drop'); if(drop){ $('#file-curr').click(); return; }
  var b=e.target.closest('[data-action]'); if(!b) return;
  var a=b.dataset.action, s=state.settings;
  switch(a){
    case 'goto': go(b.dataset.to); break;
    case 'stab': settingsTab=b.dataset.stab; render(); break;
    case 'cloud-sync': if(cloudPending()) cloudPush(); else cloudPull().then(function(){ toast('Up to date'); }); break;
    case 'cloud-signout': cloudSignOut(); break;
    case 'si-retry': cloud.client?cloudPull(true):cloudBoot(); break;
    case 'att-pick': att.sel=b.dataset.date; render(); var pe=$('.att-pill[aria-pressed="true"]'); if(pe) pe.focus({preventScroll:true}); break;
    case 'att-set': { var k=att.sel, rec=state.attendance[k]||{}; rec.s=b.dataset.st; if(rec.s==='P'&&!rec.n) delete state.attendance[k]; else { if(rec.s==='P') delete rec.s; state.attendance[k]=rec; } save(); toast(fmt(k,{wd:1})+': '+ATT_LABEL[b.dataset.st]); render(); break; }
    case 'att-step': { var dd=getCal().days, ix=dd.indexOf(att.sel)+(+b.dataset.dir); if(ix>=0&&ix<dd.length){ att.sel=dd[ix]; render(); } break; }
    case 'att-print': printHTML(attRecordHTML()); break;
    case 'att-pdf': downloadPDF(attRecordHTML(),slug(s.studentName)+'-attendance-'+slug(s.schoolYear)+'.pdf'); break;
    case 'rc-pdf-now': { var sn=buildSnapshot(rc.quarter); downloadPDF(rcHTML(sn),slug(sn.student)+'-q'+sn.quarter+'-report-card-'+slug(sn.schoolYear)+'.pdf'); break; }
    case 'rc-pdf': { var rp=state.reportCards.filter(function(x){return x.id===b.dataset.id;})[0]; if(rp) downloadPDF(rcHTML(rp),slug(rp.student)+'-q'+rp.quarter+'-report-card-'+slug(rp.schoolYear)+'.pdf'); break; }
    case 'att-download': download(slug(s.studentName)+'-attendance-'+slug(s.schoolYear)+'.html',standaloneDoc(s.studentName+' Attendance '+s.schoolYear,attRecordHTML()),'text/html'); break;
    case 'stab-go': settingsTab=b.dataset.stab; go('settings'); break;
    case 'open-subject': gb.subject=b.dataset.subject; gb.status='all'; go('grades'); break;
    case 'subject': gb.subject=b.dataset.subject; gb.q=''; render(); break;
    case 'sample': loadSample(); break;
    case 'del-row': { var tr=b.closest('tr'), id=tr.dataset.id; arm(b,'row'+id,'✓',function(){ state.assignments=state.assignments.filter(function(x){return x.id!==id;}); save(); tr.remove(); refreshRowSummaryOnly(); toast('Assignment deleted'); }); break; }
    case 'parse-paste': { var t=$('#paste-text').value; if(!t.trim()){toast('Paste your plan first');break;} setDraft('pasted text',readText(t,'')); break; }
    case 'draft-all': draft.items.forEach(function(i){i.include=true;}); refreshDraft(); break;
    case 'draft-none': draft.items.forEach(function(i){i.include=false;}); refreshDraft(); break;
    case 'draft-cancel': draft=null; refreshDraft(); break;
    case 'draft-import': doImport(); break;
    case 'remove-imported': { var sub=b.dataset.subject; arm(b,'ri'+sub,'Click again to remove',function(){ state.assignments=state.assignments.filter(function(x){return !(x.source==='import'&&x.subject===sub);}); save(); render(); toast('Removed imported '+sub); }); break; }
    case 'rc-prev': { var qs=quarterStatus(); if(qs.prev){ rc.quarter=qs.prev.n; } rc.viewing=null; go('reports'); break; }
    case 'rc-save': { var snap=buildSnapshot(rc.quarter); state.reportCards.push(snap); save(); toast('Quarter '+rc.quarter+' report card saved'); rc.viewing=snap.id; render(); break; }
    case 'rc-print-now': printHTML(rcHTML(buildSnapshot(rc.quarter))); break;
    case 'rc-view': rc.viewing=b.dataset.id; render(); break;
    case 'rc-close': rc.viewing=null; render(); break;
    case 'rc-print': { var r=state.reportCards.filter(function(x){return x.id===b.dataset.id;})[0]; if(r) printHTML(rcHTML(r)); break; }
    case 'rc-download': { var r2=state.reportCards.filter(function(x){return x.id===b.dataset.id;})[0]; if(r2) download(slug(r2.student)+'-q'+r2.quarter+'-report-card-'+slug(r2.schoolYear)+'.html',rcStandalone(r2),'text/html'); break; }
    case 'rc-delete': { var id2=b.dataset.id; arm(b,'rcd'+id2,'Confirm delete',function(){ state.reportCards=state.reportCards.filter(function(x){return x.id!==id2;}); if(rc.viewing===id2) rc.viewing=null; save(); render(); toast('Report card deleted'); }); break; }
    case 'hol-all': HOLIDAYS.forEach(function(h){s.holidays[h.id]=true;}); save(); render(); break;
    case 'hol-none': s.holidays={}; save(); render(); break;
    case 'add-break': s.breaks.push({id:uid(),label:'',start:'',end:''}); save(); render(); break;
    case 'del-break': { var bid=b.closest('[data-bid]').dataset.bid; s.breaks=s.breaks.filter(function(x){return x.id!==bid;}); save(); render(); break; }
    case 'add-extra': s.extraDays.push({id:uid(),date:'',label:''}); save(); render(); break;
    case 'del-extra': { var xid=b.closest('[data-xid]').dataset.xid; s.extraDays=s.extraDays.filter(function(x){return x.id!==xid;}); save(); render(); break; }
    case 'save-copy': { var json=JSON.stringify(Object.assign({},state,{updatedAt:Date.now()})).replace(/</g,'\\u003c'); var open='<scr'+'ipt id="embedded-data" type="application/json">', close='</scr'+'ipt>'; var i0=PRISTINE.indexOf(open), i1=PRISTINE.indexOf(close,i0); if(i0<0||i1<0){toast('Could not build the copy');break;} var html=PRISTINE.slice(0,i0+open.length)+json+PRISTINE.slice(i1); download('homeschool-gradebook-'+slug(s.studentName)+'-'+todayISO()+'.html',html,'text/html'); toast('Copy saved. Open the new file next time.'); break; }
    case 'export': download('gradebook-backup-'+todayISO()+'.json',JSON.stringify(state,null,1),'application/json'); break;
    case 'import-backup': $('#file-backup').click(); break;
    case 'reset': arm(b,'reset','Click again to erase all grades',function(){ state=defaultState(); save(); render(); toast('Gradebook erased'); }); break;
  }
});
function refreshRowSummaryOnly(){ var sm=$('#gb-summary'); if(sm) sm.innerHTML=gradesSummary(); }

document.addEventListener('change',function(e){
  var t=e.target, s=state.settings;
  // gradebook cells
  var tr=t.closest('#gb-grid tr[data-id]');
  if(tr&&t.dataset.f){ var a=findA(tr.dataset.id); if(!a) return; var f=t.dataset.f;
    if(f==='title') a.title=t.value; else if(f==='type') a.type=t.value; else if(f==='notes') a.notes=t.value;
    else if(f==='date'){ a.date=t.value; a.day=null; a.week=null; a.wday=null; }
    else if(f==='excused') a.excused=t.checked;
    else if(f==='possible') a.possible=+t.value||0;
    else if(f==='score'){ var p=parseScore(t.value,a.possible); if(!p){ toast('Use a number, 8/10, or 80%'); t.value=a.earned==null?'':a.earned; return; } a.earned=p.earned; if(p.possible!=null){ a.possible=p.possible; tr.querySelector('[data-f="possible"]').value=p.possible; } t.value=a.earned==null?'':+(+a.earned).toFixed(2); }
    save(); refreshRow(tr,a); return; }
  if(t.id==='gb-quarter'){ gb.quarter=t.value; render(); return; }
  if(t.id==='nav-subject'||t.id==='book-subject'){ if(t.value){ gb.subject=t.value; gb.q=''; go('grades'); } return; }
  if(t.id==='gb-status'){ gb.status=t.value; $('#gb-table').innerHTML=gradesTable(); return; }
  // import
  if(t.id==='file-curr'){ handleFile(t.files[0]); t.value=''; return; }
  if(t.id==='imp-subject'){ importOpts.subject=t.value; if(draft&&draft.items&&t.value!=='auto'){ draft.items.forEach(function(i){i.subject=t.value;}); refreshDraft(); } return; }
  if(t.id==='imp-strict'){ importOpts.strict=t.checked; refreshDraft(); return; }
  if(t.id==='imp-replace'){ importOpts.replace=t.checked; return; }
  if(t.id==='imp-start'&&draft){ var cw=getCal().weeks||[], ix=0; if(t.value){ ix=cw.findIndex(function(wk){ return wk[wk.length-1]>=t.value; }); if(ix<0){ toast('That date is after the last school week'); t.value=draft.startWeekOf; return; } }
    draft.startWeekOf=t.value; draft.weekShift=ix; draft.items.forEach(function(i){ if(i.baseWeek) i.week=i.baseWeek+ix; }); refreshDraft(); return; }
  if(t.id==='bulk-subject'&&t.value){ draft.items.forEach(function(i){ if(!i.subject) i.subject=t.value; }); refreshDraft(); return; }
  var dr=t.closest('tr[data-di]'); if(dr&&draft){ var it=draft.items[+dr.dataset.di], df=t.dataset.df; if(df==='include') it.include=t.checked; else it[df]=t.value; if(df!=='title') refreshDraft(); return; }
  // report card
  if(t.id==='rc-q'){ rc.quarter=+t.value; render(); return; }
  if(t.id==='att-goal'){ s.attendanceGoal=Math.max(1,Math.round(+t.value||175)); save(); render(); return; }
  if(t.id==='att-note'){ render(); return; }
  if(t.id==='rc-absent'){ rcDraft(rc.quarter).absent=Math.max(0,+t.value||0); save(); refreshPreview(); return; }
  if(t.id==='rc-pct'){ rcDraft(rc.quarter).showPercent=t.checked; save(); refreshPreview(); return; }
  if(t.id==='file-backup'){ var f=t.files[0]; t.value=''; if(!f) return; readAs(f,'text').then(function(txt){ var j=JSON.parse(txt); if(!j||!j.settings||!Array.isArray(j.assignments)) throw 0; state=normalize(j); save(); render(); toast('Backup restored'); }).catch(function(){ toast('That file isn’t a gradebook backup'); }); return; }
  // settings / calendar
  if(t.dataset.s){ var k=t.dataset.s; s[k]=t.type==='checkbox'?t.checked:(t.type==='number'?(+t.value||0):t.value); if(k==='schoolDays') s[k]=Math.round(s[k]); save(); if(['startDate','schoolDays','observeWeekend'].indexOf(k)>=0){ var fid=t.id; render(); if(fid&&$('#'+fid)) $('#'+fid).focus(); } else renderHeader(); return; }
  if(t.dataset.testlast){ s.testLast=s.testLast||{}; s.testLast[t.dataset.testlast]=t.checked; save(); render(); return; }
  if(t.dataset.meet){ var sb=t.dataset.meet, wdv=+t.dataset.wd, cur=meetDays(sb).slice(); if(t.checked){ if(cur.indexOf(wdv)<0) cur.push(wdv); } else cur=cur.filter(function(x){return x!==wdv;}); if(!cur.length){ toast('Each subject needs at least one class day'); t.checked=true; return; } s.meetDays=s.meetDays||{}; s.meetDays[sb]=cur.sort(); save(); return; }
  if(t.dataset.hol){ s.holidays[t.dataset.hol]=t.checked; save(); render(); return; }
  if(t.name==='qmode'){ s.quarterMode=t.value; save(); render(); return; }
  if(t.dataset.qe!=null){ s.customQuarterEnds[+t.dataset.qe]=t.value; save(); render(); return; }
  var br=t.closest('[data-bid]'); if(br&&t.dataset.b){ var bo=s.breaks.filter(function(x){return x.id===br.dataset.bid;})[0]; bo[t.dataset.b]=t.value; if(t.dataset.b==='start'&&!bo.end) bo.end=t.value; save(); if(t.dataset.b!=='label') render(); return; }
  var xr=t.closest('[data-xid]'); if(xr&&t.dataset.x){ var xo=s.extraDays.filter(function(x){return x.id===xr.dataset.xid;})[0]; xo[t.dataset.x]=t.value; save(); if(t.dataset.x==='date') render(); return; }
  if(t.dataset.w){ var v=Math.max(0,Math.min(100,+t.value||0)); s.weights[t.dataset.w]=v; save(); render(); return; }
  if(t.id==='scale-preset'){ s.scaleId=t.value; s.scale=JSON.parse(JSON.stringify(SCALES[t.value].rows)); save(); render(); return; }
  if(t.dataset.sc){ var row=s.scale[+t.dataset.i]; row[t.dataset.sc]=t.dataset.sc==='min'?(+t.value||0):t.value; save(); return; }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='att-note'){ var nk=att.sel, nr=state.attendance[nk]||{}; nr.n=t.value.trim(); if(!nr.n) delete nr.n; if(!nr.s&&!nr.n) delete state.attendance[nk]; else state.attendance[nk]=nr; save(); return; }
  if(t.id==='gb-search'){ gb.q=t.value; $('#gb-table').innerHTML=gradesTable(); return; }
  if(t.dataset.rcc){ rcDraft(rc.quarter).comments[t.dataset.rcc]=t.value; save(); refreshPreview(); return; }
  if(t.id==='rc-general'){ rcDraft(rc.quarter).general=t.value; save(); refreshPreview(); return; }
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&t.dataset&&t.dataset.f==='score'){ e.preventDefault(); t.dispatchEvent(new Event('change',{bubbles:true})); var tr=t.closest('tr'), nx=tr&&tr.nextElementSibling; if(nx){ var i=nx.querySelector('[data-f="score"]'); if(i){i.focus();i.select();} } }
  if((e.key==='Enter'||e.key===' ')&&t.id==='drop'){ e.preventDefault(); $('#file-curr').click(); }
});
document.addEventListener('submit',function(e){
  if(e.target.id==='si-form'){ e.preventDefault(); var em=$('#si-email').value.trim(); if(!em) return; var btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Sending…';
    cloud.client.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}}).then(function(r){
      if(r.error){ var m=r.error.message||''; cloud.msg=/sign ?ups? not allowed|not found|not allowed/i.test(m)?'That email isn’t set up for this gradebook. Add it as a user in Supabase (README, step 3).':/rate|seconds/i.test(m)?'Too many sign-in emails were sent. Wait a few minutes, then try again.':m; }
      else { cloud.sentTo=em; cloud.msg=''; }
      cloud.status='signin'; render();
    }); return; }
  if(e.target.id==='si-code-form'){ e.preventDefault(); var code=$('#si-code').value.replace(/\s/g,''); if(!code) return;
    cloud.client.auth.verifyOtp({email:cloud.sentTo,token:code,type:'email'}).then(function(r){ if(r.error){ cloud.msg='That code didn’t work. Check it, or use the newest email.'; render(); } }); return; }
  if(e.target.id!=='add-form') return; e.preventDefault();
  var title=$('#add-title').value.trim(); if(!title) return;
  var poss=+$('#add-poss').value||+state.settings.defaultPossible||100, sc=parseScore($('#add-score').value,poss);
  if(sc===null){ toast('Use a number, 8/10, or 80% for the score'); return; }
  state.assignments.push({id:uid(),subject:gb.subject,title:title,type:$('#add-type').value,date:$('#add-date').value,day:null,possible:sc.possible||poss,earned:sc.earned,excused:false,notes:'',source:'manual',order:state.assignments.length});
  save(); toast('Added to '+gb.subject); render(); var p=$('#add-panel'); if(p) p.open=true; var ti=$('#add-title'); if(ti) ti.focus();
});
['dragover','dragenter'].forEach(function(ev){ document.addEventListener(ev,function(e){ var d=e.target.closest&&e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } }); });
['dragleave','drop'].forEach(function(ev){ document.addEventListener(ev,function(e){ var d=e.target.closest&&e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); if(ev==='drop'&&e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); } }); });

loadState();
render();
if(cloud.on) cloudBoot();
})();
